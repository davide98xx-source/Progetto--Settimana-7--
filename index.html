<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sport Hub</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-content">
      <h1>Sport Hub</h1>
      <p>Cerca una squadra, scopri prossime partite e ultimi risultati</p>
      <form id="form-ricerca" class="search-form" role="search">
        <label class="visually-hidden" for="input-squadra">Cerca una squadra</label>
        <input id="input-squadra" type="search" placeholder="Es. Arsenal" autocomplete="off" aria-controls="risultati-ricerca" />
        <button type="submit">Cerca</button>
      </form>
    </div>
  </header>

  <main class="container">
    <section id="preferite" aria-labelledby="titolo-preferite">
      <h2 id="titolo-preferite"><span class="star" aria-hidden="true">★</span> Squadre Preferite</h2>
      <div id="lista-preferite" class="team-grid"></div>
    </section>

    <section aria-label="Ricerca squadre" aria-live="polite">
      <div id="spinner" class="spinner" role="status" aria-label="Caricamento" hidden></div>
      <p id="messaggio-errore" class="error-message" role="alert" hidden></p>
      <h2 id="titolo-risultati" hidden>Squadre trovate</h2>
      <div id="risultati-ricerca" class="team-grid"></div>
    </section>

    <section id="dettagli-squadra" aria-live="polite" hidden>
      <h2 id="titolo-squadra"></h2>
      <div class="details-grid">
        <article class="panel">
          <h3>Prossimi eventi</h3>
          <div id="prossimi-eventi" class="event-list"></div>
        </article>
        <article class="panel">
          <h3>Ultimi risultati</h3>
          <div id="ultimi-risultati" class="event-list"></div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
